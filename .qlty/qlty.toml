exclude_patterns = [
  "dist/**",
  "node_modules/**",
  "ci/**",
  "tests/**",
  "build/**"
]

[smells]
mode = "block"

[smells.similar_code]
enabled = false

[smells.file_complexity]
threshold = 120

[smells.function_complexity]
threshold = 100

[smells.return_statements]
threshold = 20

[[source]]
name = "default"
default = true

[[plugin]]
name = "actionlint"

[[plugin]]
name = "eslint"
version = "9.39.4"
package_file = "package.json"

[[plugin]]
name = "trufflehog"

[[plugin]]
name = "zizmor"